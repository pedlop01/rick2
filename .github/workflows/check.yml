name: Check Rick2 and editor
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev python3-jsonschema
      - run: tools/check_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rick2-engine-offline
          path: |
            build/rick2-engine-web.zip
            build/rick2-level1.rick2-project
